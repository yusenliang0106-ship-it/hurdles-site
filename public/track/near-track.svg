<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMax slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Near track in sharp focus with one hurdle, lit like a product shot. -->
  <defs>
    <linearGradient id="surf" x1="0" y1="470" x2="0" y2="1000" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c58467"/>
      <stop offset=".55" stop-color="#b3603f"/>
      <stop offset="1" stop-color="#9a4b31"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="650" x2="0" y2="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="soft"><rect y="600" width="1600" height="400" fill="url(#edge)"/></mask>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="2" seed="9"/><feColorMatrix values="0 0 0 0 .25  0 0 0 0 .14  0 0 0 0 .1  0 0 0 .45 0"/></filter>
    <radialGradient id="light" cx="800" cy="760" r="620" gradientUnits="userSpaceOnUse" gradientTransform="translate(0 760) scale(1 .35) translate(0 -760)">
      <stop offset="0" stop-color="#ffe9d6" stop-opacity=".35"/>
      <stop offset="1" stop-color="#ffe9d6" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur8"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="blur3"><feGaussianBlur stdDeviation="3"/></filter>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".55" stop-color="#f1ede8"/>
      <stop offset="1" stop-color="#d9d3cc"/>
    </linearGradient>
    <linearGradient id="stripe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4448"/>
      <stop offset=".5" stop-color="#1c2427"/>
      <stop offset="1" stop-color="#111618"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6d7579"/>
      <stop offset=".35" stop-color="#e4e7e8"/>
      <stop offset=".6" stop-color="#9aa2a6"/>
      <stop offset="1" stop-color="#4b5357"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b4448"/>
      <stop offset="1" stop-color="#15191b"/>
    </linearGradient>
    <clipPath id="boardClip"><rect x="548" y="608" width="504" height="40" rx="5"/></clipPath>
  </defs>
  <g mask="url(#soft)">
    <rect y="600" width="1600" height="400" fill="url(#surf)"/>
    <rect y="600" width="1600" height="400" filter="url(#grain)"/>
    <g fill="#f8efe6" opacity=".9">
    <polygon points="799.8,470 800.2,470 -2190,1000 -2210,1000"/>
    <polygon points="799.8,470 800.2,470 -1440,1000 -1460,1000"/>
    <polygon points="799.8,470 800.2,470 -690,1000 -710,1000"/>
    <polygon points="799.8,470 800.2,470 60,1000 40,1000"/>
    <polygon points="799.8,470 800.2,470 810,1000 790,1000"/>
    <polygon points="799.8,470 800.2,470 1560,1000 1540,1000"/>
    <polygon points="799.8,470 800.2,470 2310,1000 2290,1000"/>
    <polygon points="799.8,470 800.2,470 3060,1000 3040,1000"/>
    <polygon points="799.8,470 800.2,470 3810,1000 3790,1000"/>
    </g>
    <rect y="600" width="1600" height="400" fill="url(#light)"/>
  </g>
  <g transform="translate(800 842) scale(.64) translate(-800 -842)">
  <!-- Shadows: a soft cast shadow of the board and tight contact shadows under the feet -->
  <path d="M560 846 L1040 846 L1110 900 L500 900 Z" fill="#3b1d12" opacity=".22" filter="url(#blur8)"/>
  <ellipse cx="572" cy="842" rx="70" ry="9" fill="#2a130b" opacity=".45" filter="url(#blur3)"/>
  <ellipse cx="1028" cy="842" rx="70" ry="9" fill="#2a130b" opacity=".45" filter="url(#blur3)"/>
  <!-- Bases -->
  <path d="M520 832 L624 832 L628 842 L516 842 Z" fill="url(#base)"/>
  <path d="M976 832 L1080 832 L1084 842 L972 842 Z" fill="url(#base)"/>
  <!-- Uprights -->
  <rect x="564" y="640" width="14" height="196" rx="3" fill="url(#metal)"/>
  <rect x="1022" y="640" width="14" height="196" rx="3" fill="url(#metal)"/>
  <!-- Board with black and white bands -->
  <rect x="548" y="608" width="504" height="40" rx="5" fill="url(#board)"/>
  <g clip-path="url(#boardClip)" fill="url(#stripe)">
    <rect x="548" y="600" width="56" height="60"/>
    <rect x="660" y="600" width="56" height="60"/>
    <rect x="772" y="600" width="56" height="60"/>
    <rect x="884" y="600" width="56" height="60"/>
    <rect x="996" y="600" width="56" height="60"/>
  </g>
  <rect x="548" y="608" width="504" height="2" rx="1" fill="#fff" opacity=".9"/>
  <rect x="548" y="646" width="504" height="2" fill="#000" opacity=".18"/>
  </g>
</svg>