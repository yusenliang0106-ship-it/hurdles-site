<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMax slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- The far stretch of track, softly out of focus like a shallow depth of field. -->
  <defs>
    <linearGradient id="surf" x1="0" y1="470" x2="0" y2="1000" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d9b39c"/>
      <stop offset=".25" stop-color="#c58467"/>
      <stop offset="1" stop-color="#ad5b3f"/>
    </linearGradient>
    <linearGradient id="haze" x1="0" y1="470" x2="0" y2="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="fadeTop"><rect y="470" width="1600" height="530" fill="url(#haze)"/></mask>
    <filter id="dof" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="3.2"/></filter>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="3"/><feColorMatrix values="0 0 0 0 .3  0 0 0 0 .18  0 0 0 0 .12  0 0 0 .35 0"/></filter>
  </defs>
  <g mask="url(#fadeTop)" filter="url(#dof)">
    <rect y="500" width="1600" height="500" fill="url(#surf)"/>
    <rect y="500" width="1600" height="500" filter="url(#grain)" opacity=".5"/>
    <g fill="#f8efe6" opacity=".75">
    <polygon points="799.8,470 800.2,470 -2193,1000 -2207,1000"/>
    <polygon points="799.8,470 800.2,470 -1443,1000 -1457,1000"/>
    <polygon points="799.8,470 800.2,470 -693,1000 -707,1000"/>
    <polygon points="799.8,470 800.2,470 57,1000 43,1000"/>
    <polygon points="799.8,470 800.2,470 807,1000 793,1000"/>
    <polygon points="799.8,470 800.2,470 1557,1000 1543,1000"/>
    <polygon points="799.8,470 800.2,470 2307,1000 2293,1000"/>
    <polygon points="799.8,470 800.2,470 3057,1000 3043,1000"/>
    <polygon points="799.8,470 800.2,470 3807,1000 3793,1000"/>
    </g>
  </g>
</svg>